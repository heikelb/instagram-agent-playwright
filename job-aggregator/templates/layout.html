<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobAggrégo{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
    }
    body { background: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar-brand span.logo-dot { color: #f97316; }
    .navbar { background: var(--brand) !important; }
    .badge-indeed   { background: #2164f3; }
    .badge-hellowork{ background: #16a34a; }
    .badge-monster  { background: #dc2626; }
    .badge-linkedin { background: #0a66c2; }
    .card-job {
      border: none;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      transition: box-shadow .15s;
    }
    .card-job:hover { box-shadow: 0 4px 16px rgba(0,0,0,.14); }
    .score-star { color: #f59e0b; font-size: .9rem; }
    .contact-badge { background: #dcfce7; color: #166534; border-radius: 6px; padding: 2px 8px; font-size: .8rem; }
    .spinner-ring {
      width: 48px; height: 48px;
      border: 5px solid #e2e8f0;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .source-badge { font-size: .7rem; letter-spacing: .03em; padding: 3px 8px; border-radius: 20px; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark px-3 py-2">
  <a class="navbar-brand fw-bold fs-5" href="/">
    <i class="bi bi-search-heart me-1"></i>JobAggrégo<span class="logo-dot">.</span>
  </a>
  <div class="d-flex gap-2">
    <a href="/favorites" class="btn btn-outline-light btn-sm">
      <i class="bi bi-bookmark-heart-fill me-1"></i>Favoris
    </a>
    <a href="/" class="btn btn-light btn-sm">
      <i class="bi bi-plus-circle me-1"></i>Nouvelle recherche
    </a>
  </div>
</nav>

<div class="container py-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ 'warning' if cat == 'warning' else 'info' }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
