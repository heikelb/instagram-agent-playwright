<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{% block title %}Cold Call{% endblock %} — Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #0D0D0F;
      --card:   #16161A;
      --border: #2A2A35;
      --blue:   #3B82F6;
      --blue-s: rgba(59,130,246,0.12);
      --green:  #22C55E;
      --green-s:rgba(34,197,94,0.12);
      --red:    #EF4444;
      --red-s:  rgba(239,68,68,0.12);
      --gold:   #FFB800;
      --gold-s: rgba(255,184,0,0.12);
      --text:   #F0EEE8;
      --muted:  #7A7A8C;
      --dim:    #4A4A5A;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 80px;
    }
    h1,h2,h3 { font-family: 'Sora', sans-serif; }
    a { color: inherit; text-decoration: none; }
    button, .btn { cursor: pointer; font-family: 'Inter', sans-serif; border: none; }

    /* Cards */
    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }
    .card-sm { border-radius: 14px; padding: 14px 16px; }

    /* Buttons */
    .btn-primary {
      display: block; width: 100%;
      background: var(--blue); color: #fff;
      border-radius: 99px; padding: 15px;
      font-size: 15px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(59,130,246,0.35);
      text-align: center;
    }
    .btn-success {
      background: var(--green);
      box-shadow: 0 8px 24px rgba(34,197,94,0.35);
    }
    .btn-danger {
      background: var(--red);
      box-shadow: 0 8px 24px rgba(239,68,68,0.25);
    }
    .btn-outline {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--muted);
      border-radius: 99px; padding: 13px;
      font-size: 14px; font-weight: 700;
      display: block; width: 100%; text-align: center;
    }
    .btn-ghost {
      background: none; border: none;
      color: var(--muted); font-size: 13px;
      padding: 0;
    }

    /* Chips */
    .chip {
      display: inline-block;
      padding: 6px 14px; border-radius: 99px;
      font-size: 12px; font-weight: 700;
      border: 1.5px solid var(--border);
      background: var(--card); color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .chip.active-blue  { background: var(--blue-s);  border-color: var(--blue);  color: var(--blue); }
    .chip.active-green { background: var(--green-s); border-color: var(--green); color: var(--green); }
    .chip.active-red   { background: var(--red-s);   border-color: var(--red);   color: var(--red); }

    /* Stat boxes */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 18px; padding: 16px;
    }
    .stat-box .val { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 800; }
    .stat-box .lbl { color: var(--muted); font-size: 11px; margin-top: 2px; }

    /* Nav */
    nav.bottom {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 8px 0 20px; z-index: 100;
    }
    nav.bottom a {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 600; color: var(--muted);
      opacity: 0.45; padding: 4px 16px;
    }
    nav.bottom a.active { color: var(--blue); opacity: 1; }
    nav.bottom a span.ico { font-size: 22px; }

    /* Flash */
    .flash { background: var(--red-s); border: 1px solid var(--red); color: var(--red);
             border-radius: 12px; padding: 10px 14px; margin: 12px 16px; font-size: 13px; }

    /* Section titles */
    .section-title { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700;
                     margin-bottom: 12px; }
    /* Label */
    .label { font-size: 11px; font-weight: 700; text-transform: uppercase;
             letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }

    /* Input */
    input[type=text], input[type=password], input[type=number], textarea, select {
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
      width: 100%; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--blue); }
    textarea { resize: vertical; min-height: 70px; }

    /* Tag pill */
    .pill {
      display: inline-block; padding: 3px 10px; border-radius: 99px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
    }

    /* Scrollable row of chips */
    .chips-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .mt-4  { margin-top: 4px; }
    .mt-8  { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-20 { margin-top: 20px; }
    .mt-24 { margin-top: 24px; }
    .px-16 { padding-left: 16px; padding-right: 16px; }
    .px-20 { padding-left: 20px; padding-right: 20px; }
    .gap-8 { gap: 8px; }
    .gap-10 { gap: 10px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .text-muted { color: var(--muted); font-size: 13px; }
    .text-blue  { color: var(--blue); }
    .text-green { color: var(--green); }
    .text-red   { color: var(--red); }
    .text-gold  { color: var(--gold); }
    .fw-700 { font-weight: 700; }
    .fw-800 { font-weight: 800; }
    .fs-13 { font-size: 13px; }
    .fs-12 { font-size: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}

  {% if current_user.is_authenticated %}
  <nav class="bottom">
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">
      <span class="ico">📊</span>Accueil
    </a>
    <a href="#" onclick="document.getElementById('new-session-form').submit(); return false;"
       class="{{ 'active' if request.endpoint in ['session','log_appel'] }}">
      <span class="ico">📞</span>Session
    </a>
    <a href="{{ url_for('historique') }}" class="{{ 'active' if request.endpoint == 'historique' }}">
      <span class="ico">📋</span>Historique
    </a>
    <a href="{{ url_for('stats') }}" class="{{ 'active' if request.endpoint == 'stats' }}">
      <span class="ico">📈</span>Stats
    </a>
  </nav>
  <form id="new-session-form" action="{{ url_for('nouvelle_session') }}" method="POST" style="display:none"></form>
  {% endif %}
</body>
</html>
