{% extends 'base.html' %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div style="padding: 60px 24px 0; text-align: center;">
  <div style="font-size: 52px; margin-bottom: 16px;">📞</div>
  <h1 style="font-size: 26px; margin-bottom: 6px;">Cold Call Tracker</h1>
  <p class="text-muted" style="margin-bottom: 36px;">Ton outil de performance terrain</p>

  <form method="POST" style="text-align: left;">
    <div class="label">Mot de passe</div>
    <input type="password" name="password" placeholder="••••••••" autofocus>
    <button type="submit" class="btn btn-primary" style="margin-top: 16px; display: block; width: 100%;">
      Entrer 🔑
    </button>
  </form>
</div>
{% endblock %}
