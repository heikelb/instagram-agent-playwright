<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Connexion — Ventes Orange</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#ff7900">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ventes Orange">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="icon" type="image/png" href="/static/icons/icon-32.png">
  <link href="/static/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100dvh;
      background: linear-gradient(160deg, #ff7900 0%, #e05a00 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px 28px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      display: block;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      color: #111;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: .88rem;
      margin-bottom: 28px;
    }
    .form-control {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1.5px solid #e0e0e0;
    }
    .form-control:focus {
      border-color: #ff7900;
      box-shadow: 0 0 0 3px rgba(255,121,0,.15);
    }
    .btn-orange {
      background: #ff7900;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 700;
      width: 100%;
      margin-top: 8px;
      letter-spacing: .3px;
    }
    .btn-orange:active { background: #e06a00; }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="/static/icons/icon-192.png" class="logo" alt="Logo">
    <h1>Ventes Orange</h1>
    <p class="subtitle">Entre ton mot de passe pour accéder à tes ventes</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2 mb-3" style="border-radius:10px;font-size:.9rem;">
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <input type="password" name="password" class="form-control"
               placeholder="Mot de passe" autofocus autocomplete="current-password"
               required>
      </div>
      <button type="submit" class="btn-orange">Se connecter</button>
    </form>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
