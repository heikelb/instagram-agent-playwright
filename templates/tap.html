<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>{{ session.nom }}</title>
  <link href="/static/css/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ventes Orange">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── Barre du haut ── */
    .top-bar {
      background: #1a1a1a;
      padding: 10px 14px 8px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .session-name {
      font-size: .85rem;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-name strong { color: #ff7900; }

    /* ── Compteurs ── */
    .stats-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .stat-pill {
      flex: 1;
      background: #2a2a2a;
      border-radius: 10px;
      padding: 6px 4px;
      text-align: center;
    }
    .stat-pill .val {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
    }
    .stat-pill .lbl {
      font-size: .6rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 2px;
    }
    .stat-pill.c-total  .val { color: #fff; }
    .stat-pill.c-open   .val { color: #adb5bd; }
    .stat-pill.c-cause  .val { color: #fd7e14; }
    .stat-pill.c-entre  .val { color: #4dabf7; }
    .stat-pill.c-signe  .val { color: #51cf66; }

    /* ── Barre de progression ── */
    .progress-strip {
      height: 5px;
      display: flex;
      flex-shrink: 0;
    }
    .seg { transition: width .2s ease; }

    /* ── Grille des boutons ── */
    .btn-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 0.7fr;
      gap: 8px;
      padding: 10px;
      min-height: 0;
    }

    .tap-btn {
      border: none;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: .5px;
      transition: transform .08s, filter .08s;
      -webkit-touch-callout: none;
      position: relative;
      overflow: hidden;
    }
    .tap-btn:active { transform: scale(.93); filter: brightness(.85); }

    .tap-btn .emoji { font-size: 2rem; line-height: 1; }
    .tap-btn .count-badge {
      position: absolute;
      top: 10px; right: 12px;
      background: rgba(0,0,0,.35);
      border-radius: 20px;
      padding: 1px 7px;
      font-size: .75rem;
      font-weight: 700;
    }

    .btn-absent { background: #3a3a3a; color: #ccc; }
    .btn-refus  { background: #7f1d1d; color: #fca5a5; }
    .btn-cause  { background: #7c2d12; color: #fdba74; }
    .btn-entre  { background: #1e3a5f; color: #93c5fd; }
    .btn-signe  {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #166534, #16a34a);
      color: #fff;
      font-size: 1.3rem;
      flex-direction: row;
      gap: 10px;
    }

    /* ── Barre du bas ── */
    .bottom-bar {
      background: #1a1a1a;
      border-top: 1px solid #333;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .undo-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: .85rem;
      cursor: pointer;
    }
    .undo-btn:active { background: #333; }
    .home-link {
      color: #aaa;
      text-decoration: none;
      font-size: .85rem;
    }

    /* ── Flash de confirmation ── */
    .flash-confirm {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(.8);
      font-size: 4rem;
      opacity: 0;
      pointer-events: none;
      transition: all .15s ease;
      z-index: 100;
    }
    .flash-confirm.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- Barre du haut -->
<div class="top-bar">
  <div class="session-name">
    <i class="bi bi-geo-alt-fill" style="color:#ff7900;"></i>
    <strong>{{ session.nom }}</strong>
  </div>
  <div class="stats-row">
    <div class="stat-pill c-total">
      <div class="val" id="s-total">{{ session.total }}</div>
      <div class="lbl">Total</div>
    </div>
    <div class="stat-pill c-open">
      <div class="val" id="s-ouv">{{ session.taux_ouverture }}%</div>
      <div class="lbl">Ouvertes</div>
    </div>
    <div class="stat-pill c-cause">
      <div class="val" id="s-cause">{{ session.taux_cause }}%</div>
      <div class="lbl">Causé</div>
    </div>
    <div class="stat-pill c-entre">
      <div class="val" id="s-entre">{{ session.taux_entree }}%</div>
      <div class="lbl">Entré</div>
    </div>
    <div class="stat-pill c-signe">
      <div class="val" id="s-signe">{{ session.nb_signes }}</div>
      <div class="lbl">Signés</div>
    </div>
  </div>
</div>

<!-- Barre de progression colorée -->
<div class="progress-strip" id="progress-strip">
  <div class="seg" id="seg-absent" style="background:#3a3a3a; width:{{ 100 - session.taux_ouverture }}%;"></div>
  <div class="seg" id="seg-refus"  style="background:#7f1d1d; width:{{ (session.nb_ouvertes - session.nb_causes) / session.total * 100 if session.total else 0 }}%;"></div>
  <div class="seg" id="seg-cause"  style="background:#fd7e14; width:{{ (session.nb_causes - session.nb_entrees) / session.total * 100 if session.total else 0 }}%;"></div>
  <div class="seg" id="seg-entre"  style="background:#4dabf7; width:{{ (session.nb_entrees - session.nb_signes) / session.total * 100 if session.total else 0 }}%;"></div>
  <div class="seg" id="seg-signe"  style="background:#51cf66; width:{{ session.nb_signes / session.total * 100 if session.total else 0 }}%;"></div>
</div>

<!-- Grille boutons -->
<div class="btn-grid">

  <button class="tap-btn btn-absent" onclick="tap('absent')">
    <span class="emoji">🔘</span>
    <span>ABSENT</span>
    <span class="count-badge" id="c-absent">{{ session.portes | selectattr('resultat', 'eq', 'absent') | list | length }}</span>
  </button>

  <button class="tap-btn btn-refus" onclick="tap('refus')">
    <span class="emoji">❌</span>
    <span>REFUS</span>
    <span class="count-badge" id="c-refus">{{ session.portes | selectattr('resultat', 'eq', 'refus') | list | length }}</span>
  </button>

  <button class="tap-btn btn-cause" onclick="tap('cause')">
    <span class="emoji">💬</span>
    <span>CAUSÉ</span>
    <span class="count-badge" id="c-cause">{{ session.portes | selectattr('resultat', 'eq', 'cause') | list | length }}</span>
  </button>

  <button class="tap-btn btn-entre" onclick="tap('entre')">
    <span class="emoji">🏠</span>
    <span>ENTRÉ</span>
    <span class="count-badge" id="c-entre">{{ session.portes | selectattr('resultat', 'eq', 'entre') | list | length }}</span>
  </button>

  <button class="tap-btn btn-signe" onclick="tap('signe')">
    <span class="emoji">✅</span>
    <span>SIGNÉ !</span>
    <span class="count-badge" id="c-signe">{{ session.nb_signes }}</span>
  </button>

</div>

<!-- Barre du bas -->
<div class="bottom-bar">
  <button class="undo-btn" onclick="annuler()">↩ Annuler</button>
  <a href="{{ url_for('liste_prospection') }}" class="home-link">
    <i class="bi bi-list-ul me-1"></i>Sessions
  </a>
</div>

<!-- Flash visuel au tap -->
<div class="flash-confirm" id="flash">👍</div>

<script>
  const SESSION_ID = {{ session.id }};

  // Compteurs individuels par résultat (pour les badges)
  const counts = {
    absent: {{ session.portes | selectattr('resultat', 'eq', 'absent') | list | length }},
    refus:  {{ session.portes | selectattr('resultat', 'eq', 'refus')  | list | length }},
    cause:  {{ session.portes | selectattr('resultat', 'eq', 'cause')  | list | length }},
    entre:  {{ session.portes | selectattr('resultat', 'eq', 'entre')  | list | length }},
    signe:  {{ session.nb_signes }},
  };

  function updateUI(data) {
    document.getElementById('s-total').textContent = data.total;
    document.getElementById('s-ouv').textContent   = data.taux_ouverture + '%';
    document.getElementById('s-cause').textContent = data.taux_cause + '%';
    document.getElementById('s-entre').textContent = data.taux_entree + '%';
    document.getElementById('s-signe').textContent = data.nb_signes;

    // Badges individuels
    document.getElementById('c-absent').textContent = counts.absent;
    document.getElementById('c-refus').textContent  = counts.refus;
    document.getElementById('c-cause').textContent  = counts.cause;
    document.getElementById('c-entre').textContent  = counts.entre;
    document.getElementById('c-signe').textContent  = data.nb_signes;

    // Barre de progression
    const t = data.total || 1;
    const absP  = (t - data.nb_ouvertes) / t * 100;
    const refP  = (data.nb_ouvertes - data.nb_causes) / t * 100;
    const causeP = (data.nb_causes - data.nb_entrees) / t * 100;
    const entP  = (data.nb_entrees - data.nb_signes) / t * 100;
    const sigP  = data.nb_signes / t * 100;

    document.getElementById('seg-absent').style.width = absP + '%';
    document.getElementById('seg-refus').style.width  = refP + '%';
    document.getElementById('seg-cause').style.width  = causeP + '%';
    document.getElementById('seg-entre').style.width  = entP + '%';
    document.getElementById('seg-signe').style.width  = sigP + '%';
  }

  function showFlash(emoji) {
    const el = document.getElementById('flash');
    el.textContent = emoji;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 300);
  }

  const emojis = { absent:'🔘', refus:'❌', cause:'💬', entre:'🏠', signe:'✅' };

  async function tap(resultat) {
    // Feedback haptique si disponible
    if (navigator.vibrate) navigator.vibrate(30);
    showFlash(emojis[resultat] || '👍');

    // Incrémenter localement pour réactivité instantanée
    counts[resultat] = (counts[resultat] || 0) + 1;
    document.getElementById('c-' + resultat).textContent = counts[resultat];

    try {
      const resp = await fetch(
        `/prospection/${SESSION_ID}/tap/${resultat}`,
        { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' } }
      );
      const data = await resp.json();
      updateUI(data);
    } catch (e) {
      console.error('Erreur réseau', e);
    }
  }

  async function annuler() {
    if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
    try {
      const resp = await fetch(
        `/prospection/${SESSION_ID}/annuler`,
        { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' } }
      );
      const data = await resp.json();
      // Recalcule les compteurs individuels depuis les stats globales
      counts.signe  = data.nb_signes;
      counts.entre  = data.nb_entrees - data.nb_signes;
      // (approximation — les badges individuels se recalculent au prochain tap)
      updateUI(data);
      showFlash('↩');
    } catch (e) {
      console.error('Erreur réseau', e);
    }
  }

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  }

  // Empêcher le double-tap zoom sur iOS/Android
  let lastTap = 0;
  document.querySelectorAll('.tap-btn, .undo-btn').forEach(btn => {
    btn.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTap < 300) e.preventDefault();
      lastTap = now;
    }, { passive: false });
  });
</script>
</body>
</html>
