<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mes Ventes Orange{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .stat-card { border-left: 4px solid; border-radius: 8px; }
    .stat-card.orange  { border-color: #ff7900; }
    .stat-card.blue    { border-color: #0d6efd; }
    .stat-card.red     { border-color: #dc3545; }
    .stat-card.green   { border-color: #198754; }
    .table th { font-size: .85rem; text-transform: uppercase; color: #6c757d; }
    .badge-sms { font-size: .7rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#ff7900;">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">
      <i class="bi bi-graph-up-arrow me-1"></i> Ventes Orange
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
             href="{{ url_for('dashboard') }}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'liste_ventes' %}active{% endif %}"
             href="{{ url_for('liste_ventes') }}">
            <i class="bi bi-list-ul me-1"></i>Mes ventes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'ajouter_vente' %}active{% endif %}"
             href="{{ url_for('ajouter_vente') }}">
            <i class="bi bi-plus-circle me-1"></i>Nouvelle vente
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid py-4 px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
